[package]
name = "sjs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The sjs command line: argv, dispatch, exit codes, help."

[dependencies]
sjs-bind = { path = "../sjs-bind" }
sjs-check = { path = "../sjs-check" }
sjs-diag = { path = "../sjs-diag" }
sjs-format = { path = "../sjs-format" }
sjs-infer = { path = "../sjs-infer" }
sjs-syntax = { path = "../sjs-syntax" }
sjs-types = { path = "../sjs-types" }

[[bin]]
name = "sjs"
path = "src/main.rs"

[dev-dependencies]
sjs-testkit = { path = "../sjs-testkit" }

[lints]
workspace = true
