# The ambient table (SPEC.md §5.2, §6, §10.1; STORIES.md US-068): every global the
# language knows, transcribed from SPEC.md §6 and §10.2.
#
# One `[[global]]` per name:
#   name          the global.
#   spec          the section of SPEC.md the row transcribes.
#   source        where the global is specified: ES2025, a web standard, a runtime.
#   present       the runtimes that have it, of "browser" (current Chrome, Firefox and
#                 Safari), "node" (Node 24+), "deno" (Deno 2+), "bun" and "workerd"
#                 (Cloudflare Workers). A global missing on any one is E204.
#   members       the members the language keeps (`Global.member`).
#   open          true when every member is kept: a value, or a type whose members a
#                 later table types (Intl, the §6.2 classes).
#   removed       present when the global itself is removed (E133): the replacement of
#                 SPEC.md §12, "none" where §12 says none, "" where it names none.
#   members_only  present when the global is used through its members only (E133
#                 otherwise), with the replacement.
#   test          true for a global only a `.test.js` file has (§10.1).
#   syntax        true for a name the lexer refuses as a word (E000) before any name
#                 is looked up here.
# and after it, where needed:
#   [global.removed]  member = replacement: the removed members (E133).
#   [global.present]  member = runtimes: a kept member some runtime lacks (E204).
# A member that is neither kept nor listed as removed is E133 all the same.
#
# The fixtures under tests/conformance/06-ambient/table are generated from this file:
#   SJS_UPDATE_SNAPSHOTS=1 cargo test -p sjs-cli --test ambient

