# WHATWG Fetch Standard, https://fetch.spec.whatwg.org/

[function fetch]
idl = "Fetch §5.6, partial interface mixin WindowOrWorkerGlobalScope"
call = "(input: string | URL | Request, init?: unknown) => Promise<Response>"

[Headers]
idl = "Fetch §5.2, interface Headers"
sample = "new Headers()"
new = "(init?: unknown)"
append = "(name: string, value: string) => undefined"
delete = "(name: string) => undefined"
get = "(name: string) => string | null" # nullable
getSetCookie = "() => string[]"
has = "(name: string) => boolean"
set = "(name: string, value: string) => undefined"
entries = "() => Iterator<[string, string]>"
keys = "() => Iterator<string>"
values = "() => Iterator<string>"
forEach = "(callback: (value: string, key: string, parent: Headers) => unknown) => undefined"
"[Symbol.iterator]" = "() => Iterator<[string, string]>"

[Request]
idl = "Fetch §5.4, interface Request; §5.3, interface mixin Body"
sample = "new Request(\"https://example.com/\")"
new = "(input: string | URL | Request, init?: unknown)"
method = "string"
url = "string"
headers = "Headers"
destination = "string"
referrer = "string"
referrerPolicy = "string"
mode = "string"
credentials = "string"
cache = "string"
redirect = "string"
integrity = "string"
keepalive = "boolean"
signal = "AbortSignal"
duplex = "string"
clone = "() => Request"
body = "ReadableStream | null" # nullable
bodyUsed = "boolean"
arrayBuffer = "() => Promise<ArrayBuffer>"
blob = "() => Promise<Blob>"
bytes = "() => Promise<Uint8Array>"
formData = "() => Promise<FormData>"
json = "() => Promise<unknown>"
text = "() => Promise<string>"

[Response]
idl = "Fetch §5.5, interface Response; §5.3, interface mixin Body"
sample = "new Response(\"body\")"
new = "(body?: unknown, init?: unknown)"
static error = "() => Response"
static redirect = "(url: string | URL, status?: int32) => Response"
static json = "(data: unknown, init?: unknown) => Response"
type = "string"
url = "string"
redirected = "boolean"
status = "int32"
ok = "boolean"
statusText = "string"
headers = "Headers"
clone = "() => Response"
body = "ReadableStream | null" # nullable
bodyUsed = "boolean"
arrayBuffer = "() => Promise<ArrayBuffer>"
blob = "() => Promise<Blob>"
bytes = "() => Promise<Uint8Array>"
formData = "() => Promise<FormData>"
json = "() => Promise<unknown>"
text = "() => Promise<string>"
